name: Scheduled Swiss Macro Data Refresh

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: swiss-macro-data-refresh
  cancel-in-progress: false

jobs:
  refresh-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ingestion dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests tzdata

      - name: Run Swiss macroeconomic ingestion pipeline
        run: python scripts/fetch_data.py --trigger github_actions

      - name: Commit and push updated data artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain data/)" ]; then
            UTC_TS=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
            git add data/
            git commit -m "chore(data): scheduled refresh [${UTC_TS}]"
            git push
          else
            echo "No changes detected under data/."
          fi
